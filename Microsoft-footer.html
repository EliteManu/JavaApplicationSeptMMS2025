<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microsoft Footer</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            color: #333;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
        }
        .thanks {
            margin-bottom: 12px;
        }
        .privacy {
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
        }
        .address {
            margin: 8px 0;
        }
        .address a {
            color: #0066cc;
            text-decoration: underline;
        }
        .buttons {
            margin-top: 25px;
        }
        .btn {
            display: inline-block;
            padding: 8px 20px;
            margin-right: 8px;
            border: 1px solid #c8c8c8;
            border-radius: 9999px;
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }
        .smile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid #c8c8c8;
            border-radius: 50%;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="footer">

    <div class="thanks">
        <strong>Thanks,</strong><br>
        The Microsoft account team
    </div>

    <a href="#" class="privacy">Privacy Statement</a><br><br>

    <div class="address">
        Microsoft Corporation, One <a href="#">Microsoft Way, Redmond,</a><br>
        <a href="#">WA 98052</a>
    </div>

    <div class="buttons">
        <a href="#" class="btn">← Reply</a>
        <a href="#" class="btn">→ Forward</a>
        <span class="smile">😊</span>
    </div>

</div>

</body>
</html>
